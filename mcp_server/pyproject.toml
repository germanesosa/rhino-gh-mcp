[project]
name = "rhino-gh-mcp"
version = "1.0.0"
description = "Rhino and Grasshopper integration through the Model Context Protocol"
readme = "README.md"
authors = [
    { name = "Xun Liu" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
]

[project.scripts]
rhino-gh-mcp = "rhino_gh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rhino_gh_mcp"]
